---
- name: Installing Pre-Reqs
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  with_items:
    - certbot

- name: Create {{ modsec_docker_path }}/ and subdirectories
  ansible.builtin.file:
    state: directory
    path: "{{ item }}"
    mode: '0700'
    owner: 101
    group: 101
  loop:
    - "{{ modsec_docker_path }}/"
    - "{{ modsec_docker_path }}/sites-enabled/"
    - "{{ modsec_docker_path }}/certs/"
    - "{{ modsec_docker_path }}/modsecurity-proxyconf/"
    - "{{ modsec_docker_path }}/crs-plugins/"

- name: Ensure modsecurity-nginx Docker network exists
  community.docker.docker_network:
    name: "{{ modsecurity_network_name }}"
    ipam_config:
      - subnet: "{{ modsecurity_network_subnet }}"

- name: Copy nginx.conf template
  ansible.builtin.copy:
    src: nginx.conf
    dest: "{{ modsec_docker_path }}/nginx.conf"
    mode: '0600'
    owner: 101
    group: 101

- name: Copy modsecurity.conf template
  ansible.builtin.copy:
    src: modsecurity.conf
    dest: "{{ modsec_docker_path }}/modsecurity.conf"
    mode: '0600'
    owner: 101
    group: 101

- name: Copy proxy configurations
  ansible.builtin.template:
    src: "{{ domain.template | default(domain.name ~ '.conf') }}"
    dest: "{{ modsec_docker_path }}/sites-enabled/{{ domain.name }}.conf"
    mode: '0600'
    owner: 101
    group: 101
  loop: "{{ domains }}"
  loop_control:
    label: "{{ domain.name }}"
    loop_var: domain
  notify: Restart modsecurity-nginx

- name: Get certificates and keys
  block:
    - name: Disable geoip-shell for standalone certbot
      ansible.builtin.command:
        cmd: geoip-shell off
      changed_when: false
      failed_when: false
      when: geoip_shell_enabled | default(true)

    - name: Stop modsecurity-nginx for standalone certbot
      community.docker.docker_container:
        name: modsecurity-nginx
        state: stopped
      failed_when: false

    # ATTENTION! Known issue: https://www.freeipa.org/release-notes/4-10-2.html#known-issues
    # because of this we need to hardcode rsa keytype and size
    - name: Get Certificate and Key
      ansible.builtin.command:
        cmd: "certbot certonly -n --standalone -d {{ cert_domain.name }} --server {{ nginx_ca }} --no-verify-ssl --agree-tos --email '{{ nginx_ca_mail }}'"
      changed_when: false
      loop: "{{ domains }}"
      loop_control:
        label: "{{ cert_domain.name }}"
        loop_var: cert_domain
  always:
    - name: Start modsecurity-nginx after standalone certbot
      community.docker.docker_container:
        name: modsecurity-nginx
        state: started
      failed_when: false

    - name: Enable geoip-shell after standalone certbot
      ansible.builtin.command:
        cmd: geoip-shell on
      changed_when: false
      failed_when: false
      when: geoip_shell_enabled | default(true)

- name: Create cron
  ansible.builtin.cron:
    name: "Certbot"
    job: >-
      {{ 'geoip-shell off && ' if geoip_shell_enabled | default(false) else '' }}docker stop modsecurity-nginx && certbot -q renew --no-verify-ssl && chown -R 101:101 /etc/letsencrypt/{{ ' && geoip-shell on' if geoip_shell_enabled | default(false) else '' }} && docker start modsecurity-nginx
    minute: 0
    hour: 0

- name: Create modsecurity-proxyconf
  ansible.builtin.blockinfile:
    create: true
    path: "{{ modsec_docker_path }}/modsecurity-proxyconf/{{ item.name }}.conf"
    block: |
      Include /etc/modsecurity.d/setup.conf
      {{ item.modsec_config }}
    mode: '0600'
    owner: 101
    group: 101
  loop: "{{ domains }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart modsecurity-nginx

- name: Remove legacy Nextcloud CRS plugin copies
  ansible.builtin.file:
    path: "{{ modsec_docker_path }}/modsecurity-proxyconf/{{ item }}"
    state: absent
  loop: "{{ modsecurity_nextcloud_plugin_files }}"
  notify: Restart modsecurity-nginx

- name: Download Nextcloud CRS plugin files
  ansible.builtin.uri:
    url: "{{ modsecurity_nextcloud_plugin_base_url }}/{{ item }}"
    return_content: true
  loop: "{{ modsecurity_nextcloud_plugin_files }}"
  register: nextcloud_crs_plugin_downloads

- name: Install Nextcloud CRS plugin files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ modsec_docker_path }}/crs-plugins/{{ item.item }}"
    mode: '0600'
    owner: 101
    group: 101
  loop: "{{ nextcloud_crs_plugin_downloads.results }}"
  loop_control:
    label: "{{ item.item }}"
  notify: Restart modsecurity-nginx

- name: Start modsecurity-nginx container
  community.docker.docker_container:
    image: owasp/modsecurity-crs:{{ modsecurity_crs_tag }}
    pull: true
    name: modsecurity-nginx
    recreate: true
    restart_policy: always
    env:
      MODSEC_RULE_ENGINE: "{{ modsecurity_rule_engine }}"
    networks:
      - name: "{{ modsecurity_network_name }}"
        ipv4_address: "{{ modsecurity_ipv4_address }}"
    ports:
      - 80:80
      - 443:443
    volumes:
      - "{{ modsec_docker_path }}/nginx.conf:/etc/nginx/templates/nginx.conf.template"
      - "{{ modsec_docker_path }}/modsecurity.conf:/etc/nginx/templates/conf.d/modsecurity.conf.template"
      - "/etc/letsencrypt/live:/etc/letsencrypt/live"
      - "/etc/letsencrypt/archive:/etc/letsencrypt/archive"
      - "{{ modsec_docker_path }}/sites-enabled:/etc/nginx/sites-enabled"
      - "{{ modsec_docker_path }}/modsecurity-proxyconf:/etc/nginx/modsecurity-proxyconf"
      - "{{ modsec_docker_path }}/crs-plugins:/etc/modsecurity.d/owasp-crs/plugins:ro"
      - "/var/log/nginx/:/var/log/nginx/"
  tags: update-container
