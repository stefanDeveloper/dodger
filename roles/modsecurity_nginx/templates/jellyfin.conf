server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         www.{{ domain.name }} {{ domain.name }};

    # SSL
    ssl_certificate     /etc/letsencrypt/live/{{ domain.name }}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{ domain.name }}/privkey.pem;

    # logging
    access_log          /var/log/nginx/access_{{ domain.name }}.log stripsecrets buffer=512k flush=1m if=$log_agent;
    error_log           /var/log/nginx/error_{{ domain.name }}.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size {{ domain.client_max_body_size | default('20M') }};

    location / {
        # ModSec config
        modsecurity_rules_file  /etc/nginx/modsecurity-proxyconf/{{ domain.name }}.conf;

        proxy_pass              {{ domain.proxy_pass | default('http://172.18.0.11:8096') }};
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Protocol $scheme;
        proxy_set_header        X-Forwarded-Host $http_host;
        proxy_buffering         off;
    }

    location /socket {
        # ModSec config
        modsecurity_rules_file  /etc/nginx/modsecurity-proxyconf/{{ domain.name }}.conf;

        proxy_pass              {{ domain.proxy_pass | default('http://172.18.0.11:8096') }};
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Protocol $scheme;
        proxy_set_header        X-Forwarded-Host $http_host;
    }
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name www.{{ domain.name }} {{ domain.name }};

    # logging
    access_log  /var/log/nginx/access_{{ domain.name }}.log stripsecrets buffer=512k flush=1m if=$log_agent;
    error_log   /var/log/nginx/error_{{ domain.name }}.log warn;
    return      301 https://{{ domain.name }}$request_uri;
}
