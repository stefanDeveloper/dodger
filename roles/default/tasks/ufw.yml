---

- name: Install UFW dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - ufw

- name: Configure UFW for public services
  when: default_configure_ufw
  block:
    - name: Set UFW incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set UFW outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow host TCP services through UFW
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item }}"
      loop: "{{ default_ufw_allowed_tcp_ports }}"

    - name: Allow host TCP services through UFW from trusted sources
      community.general.ufw:
        rule: allow
        proto: tcp
        port: "{{ item.port }}"
        from_ip: "{{ item.from_ip }}"
        to_ip: "{{ item.to_ip | default(omit) }}"
        comment: "{{ item.comment | default(omit) }}"
      loop: "{{ default_ufw_allowed_tcp_rules }}"
      loop_control:
        label: "{{ item.from_ip }} -> {{ item.to_ip | default('any') }}:{{ item.port }}"

    - name: Remove UFW Docker table rules
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} ANSIBLE MANAGED BLOCK - Docker UFW"
        state: absent
      notify: Reload ufw

    - name: Enable UFW
      community.general.ufw:
        state: enabled

# code: language=ansible
